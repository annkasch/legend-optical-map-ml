[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legend-optical-map-ml"
version = "0.1.0"
description = "LEGEND LAr optical-map data and configs for RESUM_FLEX surrogates"
requires-python = ">=3.11"
dependencies = [
    "resum-flex",  # https://github.com/annkasch/RESUM_FLEX
    "h5py>=3.10",
    "numpy",
    "scipy",
    "pydantic>=2",
    "pyyaml",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["legend_optical_map_ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
