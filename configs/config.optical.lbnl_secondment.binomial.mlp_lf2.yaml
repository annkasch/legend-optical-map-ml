# As config.optical.lbnl_secondment.binomial.mlp.yaml, but with the LF2_train counts as well:
# the same observations as config.optical.lbnl_secondment.binomial.yaml plus the MLP covariate.
observations:
- {partition: gp_unlabeled, fidelity: lf}   # LF2_train
- {partition: gp_train, fidelity: hf}       # HF_train
evaluation:
- {partition: gp_validation, fidelity: hf}
covariate:
  inference:
    gp_unlabeled/lf: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/gp_unlabeled_lf_photons-gp_unlabeled_lf.npz
    gp_train/hf: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/gp_train_hf_photons-gp_unlabeled_lf.npz
    gp_validation/hf: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/gp_validation_hf_photons-gp_unlabeled_lf.npz
kernel: matern52
n_restarts: 2
seed: 0
coverage_ylim: [0, 0.0065]   # fixed y range of the coverage plots
data_directory: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: config.optical.lbnl_secondment.data.yaml
output_directory: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/binomial_mlp_lf2_hf/v1/seed0
