# As mlp_bll.yaml (v2), but the network sees the emission point theta + phi_vertex (summed in
# physical units) instead of voxel centre and offset separately (2026-11-12): the field model
# with no Fourier encoding and no direction encoding is a plain MLP on (position, px, py, pz).
# Tests whether the offset dependence then follows the theta gradient, as physics requires.
model:
  kind: field
  architecture:
    hidden_dims: [256, 256, 256]
    dropout: 0.0
  position: {phi_columns: [0, 1, 2]}   # voxel centre + emission offset = emission point
  encoding: {kind: none}               # raw position: a plain MLP, no Fourier features
  # no direction: px, py, pz enter unencoded, as in mlp_bll.yaml
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 10
  eval_every: 100
  learning_rate: 0.001
  batch_size: 16
  n_events: 750
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # No dedicated CNP test list is provided in this dataset.
data_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: gp_unlabeled, fidelity: lf}   # LF2_train
- {partition: gp_train, fidelity: hf}       # HF_train
partitions: {validation: cnp_validation, test: cnp_test}
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp_bll_pos/v1/seed0
selection_max_design_points: 500
evaluation_threads: 16
residual_test: {}  # residual learnability test at read-out (RESUM_FLEX docs/evaluation.md)
