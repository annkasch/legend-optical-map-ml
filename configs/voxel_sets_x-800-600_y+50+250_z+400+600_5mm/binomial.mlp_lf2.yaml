# As voxel_sets_x-800-600_y+50+250_z+400+600_5mm/binomial.mlp.yaml, but with the LF2_train counts as well:
# the same observations as voxel_sets_x-800-600_y+50+250_z+400+600_5mm/binomial.yaml plus the MLP covariate.
observations:
- {partition: rate_unlabeled, fidelity: lf}   # LF2_train
- {partition: rate_train, fidelity: hf}       # HF_train
evaluation:
- {partition: rate_validation, fidelity: hf}
covariate:
  inference:
    rate_unlabeled/lf: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/rate_unlabeled_lf_photons-rate_unlabeled_lf.npz
    rate_train/hf: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/rate_train_hf_photons-rate_unlabeled_lf.npz
    rate_validation/hf: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/rate_validation_hf_photons-rate_unlabeled_lf.npz
kernel: matern52
n_restarts: 2
seed: 0
coverage_ylim: [0, 0.0065]   # fixed y range of the coverage plots
data_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/binomial_mlp_lf2_hf/v1/seed0
