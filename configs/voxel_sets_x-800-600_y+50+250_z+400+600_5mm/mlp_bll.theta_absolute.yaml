# v2 (2026-11-16): v1 with a cosine learning-rate decay to 1 % and 20 instead of 10 passes,
# so late checkpoints stop swinging; seeds 0-2 (seed0 here, --run-seed 1/2). Selection unchanged.
#   sbatch -q regular -t 03:00:00 --job-name=mlp-bll-theta-absolute-v2-s<N> \
#     scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/mlp_bll.theta_absolute.yaml train --run-seed <N>
# As mlp_bll.yaml (v2), but on the `theta_absolute` view of data.yaml: input comparison (b)
# (2026-11-13). Inputs: θ (x, y, z), raw vertex (x, y, z), px, py, pz. Same training data (LF2 +
# HF train), selection and seed, so only the input representation differs.
#   sbatch -q regular -t 03:00:00 --job-name=mlp-bll-theta-absolute-v1 \
#     scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/mlp_bll.theta_absolute.yaml train
model:
  kind: mlp
  architecture:
    hidden_dims: [256, 256, 256]
    dropout: 0.0
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 20
  eval_every: 100
  learning_rate: 0.001
  lr_schedule: {kind: cosine, final_fraction: 0.01}
  batch_size: 16
  n_events: 750
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # Test (rate_test) stays blinded; benchmark and score stage unblind it at the end.
data_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data/views/theta_absolute
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: rate_unlabeled, fidelity: lf}   # LF2_train
- {partition: rate_train, fidelity: hf}       # HF_train
partitions: {validation: evt_validation, test: rate_test}  # rate model: its test set is the blinded GP test (core.surrogates score refuses it)
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp_bll_theta_absolute/v2/seed0
selection_max_design_points: 500
evaluation_threads: 16
residual_test: {threads: 16}  # read-out residual test; threads as residual.mlp_bll.yaml
