# As mlp_bll.yaml (v2), but on the `emission` view of data.yaml (2026-11-13): the network sees
# only the emission point (absolute vertex x, y, z) and px, py, pz, no voxel centre. Same
# training data (LF2 + HF train), selection and seed, so only the input representation differs.
# Replaces the field model summing centre + offset inside the network (mlp_bll_pos/v1, removed
# 2026-11-13 after matching this run: HF validation NLL 2.392 vs 2.391).
#   sbatch -q regular -t 03:00:00 --job-name=mlp-bll-emission-v1 \
#     scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/mlp_bll.emission.yaml train
model:
  kind: mlp
  architecture:
    hidden_dims: [256, 256, 256]
    dropout: 0.0
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 10
  eval_every: 100
  learning_rate: 0.001
  batch_size: 16
  n_events: 750
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # No dedicated CNP test list is provided in this dataset.
data_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data/views/emission
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: gp_unlabeled, fidelity: lf}   # LF2_train
- {partition: gp_train, fidelity: hf}       # HF_train
partitions: {validation: cnp_validation, test: cnp_test}
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp_bll_emission/v1/seed0
selection_max_design_points: 500
evaluation_threads: 16
residual_test: {threads: 16}  # read-out residual test; threads as residual.mlp_bll.yaml
