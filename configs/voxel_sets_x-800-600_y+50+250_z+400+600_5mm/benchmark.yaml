# Benchmark of the LBNL 5 mm rate models on GP_val (docs/benchmark.md):
#   python -m legend_optical_map_ml.benchmark configs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/benchmark.yaml
# Reads finished runs only. Waiting for the reruns after the RESUM_FLEX design point rename
# (2026-11-10): replace each vNEXT with the new run version; for a pipeline of several runs,
# list each run (directory with compute.json, or scores/inference json) under compute.
# countfield runs record no compute.json: their compute is not reported.
title: LBNL 5 mm rate models
partition: gp_validation
fidelity: hf
reference: Binomial GP
output_directory: /global/cfs/projectdirs/m2676/users/aschuetz/data/benchmarks/lbnl_secondment_5mm_gp_validation
models:
- label: Binomial GP
  kind: binomial_gp
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/binomial/vNEXT/seed0
- label: GP + MLP (LF2 + HF)
  kind: binomial_gp
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/binomial_mlp_lf2_hf/vNEXT/seed0
  note: MLP as covariate; compute = MLP training + donor inference + GP fit.
- label: GP + MLP (HF)
  kind: binomial_gp
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/binomial_mlp_hf/vNEXT/seed0
  note: Ablation, GP on HF train only; compute = MLP training + donor inference + GP fit.
- label: Neural process
  kind: countfield
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/countfield/lbnl_secondment_5mm/seed0
- label: RESuM MLP → MFGP
  kind: mfgp
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/mfgp_mlp_hf_log/vNEXT/seed0
  note: compute = MLP training + LF2 inference + MFGP fit.
- label: MFGP raw LF
  kind: mfgp
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/mfgp_raw_lf_hf_log/vNEXT/seed0
- label: MLP + BLL
  kind: event_model
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp_bll/vNEXT/seed0
- label: Field f1
  kind: event_model
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/field_f1/vNEXT/seed0
- label: Field f2
  kind: event_model
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/field_f2/vNEXT/seed0
- label: Field f4
  kind: event_model
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/field_f4/vNEXT/seed0
- label: Field f8
  kind: event_model
  run: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/field_f8/vNEXT/seed0
