# The CSV manifests define the roles; their stp_file paths are relative to the dataset root.
# LF_train/CNP_val are the initial event-model train/validation sets. LF2_train and HF_train
# form the GP training inputs; GP_val is split 50/50 (seeded) into GP validation and a blinded
# GP test set. 11 GP_val voxels share their position with CNP_val (the lists were sampled
# independently); kept, although it leaks the CNP checkpoint choice slightly into the GP test.
source:
  manifests:
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_LF_train.csv
    role: cnp_train
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_CNP_val.csv
    role: cnp_validation
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_LF2_train.csv
    role: gp_unlabeled
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_HF_train.csv
    role: gp_train
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_GP_val.csv
    fractions: {gp_validation: 0.5, gp_test: 0.5}
output_directory: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data
cache_directory: ../../outputs/event_cache  # shared by all datasets (docs/event-cache.md)
theta:
  coordinates: cartesian
  center_source: filename # CSV x_mm/y_mm/z_mm override the rounded filename center.
phi:
  vertex:
    representation: offset
    coordinates: cartesian
  momentum:
    representation: components
target:
  kind: any_channel
split:
  seed: 42
  manifest: ../../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data/splits/voxel_split.json
normalization:
  method: standard
  fit_on: training
# Further views of the same files and split (docs/data-config.md, Views); written to
# data/views/<name>/, picked by a run's data_directory.
views:
  emission:   # emission point (absolute vertex) + momentum only; voxel centre no network input
    theta:
      model_input: false
      coordinates: cartesian
      center_source: filename
    phi:
      vertex:
        representation: absolute
        coordinates: cartesian
      momentum:
        representation: components
  # Input comparison for MLP + BLL (2026-11-13): (a) θ + offset + momentum is the top-level view,
  # (b) θ + raw vertex + momentum, (c) raw vertex + momentum is `emission`; each also cylindrical
  # about the z axis: θ and raw vertex as (r, sin, cos, z), offset and momentum rotated into the
  # local radial / tangential / z frame (offset views: centre azimuth; raw vertex: vertex azimuth).
  theta_absolute:   # (b)
    phi:
      vertex:
        representation: absolute
        coordinates: cartesian
      momentum:
        representation: components
  cylindrical:   # (a) cylindrical
    theta:
      coordinates: cylindrical
      center_source: filename
    phi:
      vertex:
        representation: offset
        coordinates: cylindrical
      momentum:
        representation: components
        coordinates: cylindrical
  theta_absolute_cylindrical:   # (b) cylindrical
    theta:
      coordinates: cylindrical
      center_source: filename
    phi:
      vertex:
        representation: absolute
        coordinates: cylindrical
      momentum:
        representation: components
        coordinates: cylindrical
  emission_cylindrical:   # (c) cylindrical; θ (no input) stays cartesian metadata as in emission
    theta:
      model_input: false
      coordinates: cartesian
      center_source: filename
    phi:
      vertex:
        representation: absolute
        coordinates: cylindrical
      momentum:
        representation: components
        coordinates: cylindrical
