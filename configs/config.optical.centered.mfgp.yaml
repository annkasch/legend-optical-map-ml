# Two-level MFGP on centered_425_375_375 (2026-10-28): MLP mean on unlabeled LF voxels ->
# observed HF fraction (target). HF_sim voxels sit at LF_primaries positions (nested design).
# GP choices are compared on gp_validation; gp_test stays blinded (unblind_test).
levels:
- source: model_mean
  partition: gp_unlabeled
  fidelity: lf
  inference: ../outputs/voxel_sets_x+365+485_y+315+435_z+297.5+452.5_5mm/event_learning/mlp_v1/seed0/inference/best/gp_unlabeled_lf.npz
- source: observed_fraction
  partition: gp_train
  fidelity: hf
evaluation:
- {partition: gp_validation, fidelity: hf}
output_transform: identity   # plain hit rate first (user); log is the alternative
kernel: rbf
n_restarts: 5
seed: 0
data_directory: ../outputs/voxel_sets_x+365+485_y+315+435_z+297.5+452.5_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: config.optical.centered.cnp.data.yaml
output_directory: ../outputs/voxel_sets_x+365+485_y+315+435_z+297.5+452.5_5mm/regression/mfgp_mlp_v1_hf/seed0
