# The CSV manifests define the roles; their stp_file paths are relative to the dataset root.
# LF_train/CNP_val are the initial event-model train/validation sets. LF2_train and HF_train
# form the GP training inputs; GP_val is split 50/50 (seeded) into GP validation and a blinded
# GP test set. 11 GP_val voxels share their position with CNP_val (the lists were sampled
# independently); kept, although it leaks the CNP checkpoint choice slightly into the GP test.
source:
  manifests:
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_LF_train.csv
    role: cnp_train
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_CNP_val.csv
    role: cnp_validation
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_LF2_train.csv
    role: gp_unlabeled
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_HF_train.csv
    role: gp_train
  - path: /global/cfs/cdirs/m2676/users/calgaro/lbnl_secondment/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/voxels_GP_val.csv
    fractions: {gp_validation: 0.5, gp_test: 0.5}
output_directory: ../outputs/optical_lbnl_secondment_5mm
theta:
  coordinates: cartesian
  center_source: filename # CSV x_mm/y_mm/z_mm override the rounded filename center.
phi:
  vertex:
    representation: offset
    coordinates: cartesian
  momentum:
    representation: components
target:
  kind: any_channel
split:
  seed: 42
  manifest: ../outputs/optical_lbnl_secondment_5mm/splits/voxel_split.json
normalization:
  method: standard
  fit_on: training
