# Within-design-point metrics (RESUM_FLEX `within_point` stage, docs/evaluation.md) on the
# finished genesis neural field f2, trained on the photon store before the read-out had them.
# Reads the run's saved logits and labels of its best checkpoint on both voxel evaluation sets
# (LF = cnp_validation, HF = gp_validation of the voxel campaign) and writes within_point.json,
# arrays and plots into the run directory, next to its read-out (the run's own files stay
# unchanged). The photon validation set is not grouped by voxel and has no within-point metrics.
run: ../../outputs/photon_x+300+500_y-100+100_z-100+100/event_learning/field_f2/v1/seed0
checkpoints: [best]
sets: [validation/lf, validation/hf]
within_point_null_draws: 1000
