# Heteroscedastic variant of config.optical.lbnl_secondment.mfgp.log.yaml (MLP mean -> HF):
# fixed binomial noise per observed voxel (observation_noise: binomial). Needs the
# RESUM_FLEX heteroscedastic-noise branch.
levels:
- source: model_mean
  partition: gp_unlabeled
  fidelity: lf
  inference: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/event_learning/mlp/v2/seed0/inference/best/gp_unlabeled_lf.npz
- source: observed_fraction
  partition: gp_train
  fidelity: hf
evaluation:
- {partition: gp_validation, fidelity: hf}
output_transform: log   # log of the rate; observed fractions smoothed to (m + 0.5)/(N + 1)
kernel: rbf
n_restarts: 5
seed: 0
data_directory: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: config.optical.lbnl_secondment.data.yaml
observation_noise: binomial
coverage_ylim: [0, 0.0065]
output_directory: ../outputs/voxel_sets_x-800-600_y+50+250_z+400+600_5mm/regression/mfgp_mlp_hf_log_hetnoise/v1/seed0
