# MLP baseline for voxel_sets_x+365+485_y+315+435_z+297.5+452.5_5mm/cnp.yaml: same data, seed, steps, episodes and
# selection; only the model differs (no context input).
model:
  kind: mlp
  architecture:
    hidden_dims: [256, 256, 256]   # ~134k parameters, close to the CNP (~126k)
    dropout: 0.0
training:
  backend: neural
  loss: bernoulli
  n_passes: 10          # passes over the training events; steps computed at run time
  eval_every: 100       # ~34 validation checkpoints over 3380 steps
  learning_rate: 0.001
  batch_size: 16        # voxels per step
  n_events: 750         # events per voxel per step (half of 1500)
  targets: disjoint     # or joint (natural sampling only)
  context:
    size: random        # one size per step, shared by all voxels
    n_min: 16
    max_fraction: 0.5   # cap 375 of 750; null = no cap
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural   # real event proportions, so outputs are probabilities (no mixup)
  weighting:
    strategy: none
# Lowest validation log loss (proper score for event probabilities).
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [lf]
data_directory: ../../outputs/voxel_sets_x+365+485_y+315+435_z+297.5+452.5_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
partitions: {train: cnp_train, validation: cnp_validation, test: cnp_test}
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+365+485_y+315+435_z+297.5+452.5_5mm/event_learning/mlp/v1/seed0
validation_context_events: 200
# Read-out only: same 1125 targets per voxel (events after the first 375), nested contexts.
validation_context_sweep: [16, 64, 128, 256, 375]
validation_seed: 12345
# Checkpoint selection uses at most 5000 validation voxels (v0 has ~250, so all of them);
# full validation and test sets are evaluated once at the end.
selection_max_voxels: 5000
evaluation_threads: 16
