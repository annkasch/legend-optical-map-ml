# Hyperparameter sweep (options 3a, 2026-11-16): mlp_bll.theta_absolute.yaml (v2) with
# n_events 1500 (all LF photons of a voxel); all else unchanged (baseline = mlp_bll_theta_absolute/v2/seed0). Seed 0.
#   sbatch -q regular -t 04:00:00 --job-name=sweep-ev1500 \
#     scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/mlp_bll.theta_absolute.ev1500.yaml train
model:
  kind: mlp
  architecture:
    hidden_dims: [256, 256, 256]
    dropout: 0.0
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 20
  eval_every: 100
  learning_rate: 0.001
  lr_schedule: {kind: cosine, final_fraction: 0.01}
  batch_size: 16
  n_events: 1500
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # Test (rate_test) stays blinded; benchmark and score stage unblind it at the end.
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data/views/theta_absolute
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: rate_unlabeled, fidelity: lf}   # evt_2_train
- {partition: rate_train, fidelity: hf}       # reg_1_train
partitions: {validation: evt_validation, test: rate_test}  # rate model: its test set is the blinded GP test (core.surrogates score refuses it)
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/event_learning/mlp_bll_theta_absolute_ev1500/v1/seed0
selection_max_design_points: 500
evaluation_threads: 16
residual_test: {threads: 16}  # read-out residual test; threads as the other datasets
