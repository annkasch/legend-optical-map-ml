# CNP + BLL + mixup with input (b) (2026-11-16): cnp_bll.theta_absolute.yaml with class-aware
# mixup as an added loss term (real_plus_mixup, weight 0.001, real context), so outputs stay
# probabilities and the selection stays bernoulli_log_loss. LF validation only (no score config).
#   sbatch -q regular -t 04:00:00 --job-name=box-cnp-bll-mixup-theta-absolute-v1 \
#     scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/cnp_bll.mixup.theta_absolute.yaml train
model:
  kind: cnp
  encoder:          # as the earlier cnp.yaml (voxel_sets_x+365+485_…)
    type: mlp
    latent_dim: 64
    hidden_dims: [128, 128]
    dropout: 0.0
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 20
  eval_every: 100
  learning_rate: 0.001
  lr_schedule: {kind: cosine, final_fraction: 0.01}
  batch_size: 16
  n_events: 750
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: real_plus_mixup   # mean(real BCE) + 0.001 * mean(mixed BCE): outputs stay probabilities
    mixup_loss_weight: 0.001
    real_target_ratio: 1.0
  sampling:
    strategy: class_aware_mixup
    mixup:
      alpha: 0.2
      mix_context: false        # real context: the rate the CNP reads from it stays unmixed
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # Test (gp_test) stays blinded; benchmark and score stage unblind it at the end.
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data/views/theta_absolute
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: gp_unlabeled, fidelity: lf}   # LF2_train
- {partition: gp_train, fidelity: hf}       # HF_train
partitions: {validation: cnp_validation, test: gp_test}  # rate model: its test set is the blinded GP test (core.surrogates score refuses it)
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/event_learning/cnp_bll_mixup_theta_absolute/v1/seed0
selection_max_design_points: 500
evaluation_threads: 16
residual_test: {threads: 16}  # read-out residual test; threads as the other datasets
validation_context_events: 200
validation_context_sweep: [16, 64, 128, 256, 375]
