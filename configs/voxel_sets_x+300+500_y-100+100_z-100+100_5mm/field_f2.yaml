# Neural field on the box voxel campaign (options F1 stage 1, 2026-11-23): training data,
# view and selection of mlp_bll.theta_absolute.lr3e-3.yaml (LF2 + HF train, theta_absolute
# view, selected on all of evt_validation), network of
# ../photon_x+300+500_y-100+100_z-100+100/field_f2.yaml (Fourier max_frequency 2 on the absolute
# emission point, spherical harmonics on the direction). Base = the old field setting
# (constant learning rate 1e-3, 10 passes, as voxel_sets_x-800-600_y+50+250_z+400+600_5mm/field_f2.yaml);
# variants field_f2.<parts>.yaml: cos (cosine decay to 0.01), lr<x>, p<n> (n_passes).
#   sbatch -q regular -t 04:00:00 --job-name=field-f2 \
#     scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/field_f2.yaml train
model:
  kind: field
  architecture:
    hidden_dims: [256, 256, 256]
    dropout: 0.0
  direction: {phi_columns: [3, 4, 5], degree: 4}   # photon momentum direction
  encoding: {kind: fourier, columns: [0, 1, 2], n_frequencies: 8, max_frequency: 2.0}   # absolute emission point (phi of theta_absolute); theta unused
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 10
  eval_every: 100
  learning_rate: 0.001
  batch_size: 16
  n_events: 750
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # Test (rate_test) stays blinded; benchmark and score stage unblind it at the end.
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data/views/theta_absolute
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: rate_unlabeled, fidelity: lf}   # evt_2_train
- {partition: rate_train, fidelity: hf}       # rate_1_train
partitions: {validation: evt_validation, test: rate_test}  # rate model: its test set is the blinded GP test (core.surrogates score refuses it)
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/event_learning/field_f2/v1/seed0
evaluation_threads: 16
residual_test: {threads: 16}  # read-out residual test; threads as the other datasets
