# Binomial count GP on the genesis-remage voxel campaign x+300+500_y-100+100_z-100+100_5mm:
# one latent hit probability fitted to the hit counts of LF2_train (1500 events per voxel)
# and HF_train (5000 events per voxel). Same settings as voxel_sets_x-800-600_y+50+250_z+400+600_5mm/binomial.yaml.
observations:
- {partition: gp_unlabeled, fidelity: lf}   # LF2_train
- {partition: gp_train, fidelity: hf}       # HF_train
evaluation:
- {partition: gp_validation, fidelity: hf}
kernel: matern52
n_restarts: 2
seed: 0
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/regression/binomial/v1/seed0
