# Heteroscedastic variant of voxel_sets_x+300+500_y-100+100_z-100+100_5mm/mfgp.raw_lf.log.yaml: binomial count
# noise per observed voxel at the GP's predicted rate (observation_noise: binomial) (2026-11-17).
#   BLAS_THREADS=32 sbatch -q regular -t 02:00:00 scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/mfgp.raw_lf.log.hetnoise.yaml mfgp
levels:
- source: observed_fraction
  partition: rate_unlabeled   # evt_2_train, 1500 events per voxel
  fidelity: lf
- source: observed_fraction
  partition: rate_train       # rate_1_train, 5000 events per voxel (target)
  fidelity: hf
evaluation:
- {partition: rate_validation, fidelity: hf}
output_transform: log   # log of the rate; observed fractions smoothed to (m + 0.5)/(N + 1)
kernel: rbf
n_restarts: 5
seed: 0
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: data.yaml
observation_noise: binomial
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/regression/mfgp_raw_lf_hf_log_hetnoise/v1/seed0
