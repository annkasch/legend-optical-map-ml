# RESuM two-level MFGP on voxel_sets_x+300+500_y-100+100_z-100+100_5mm (options S1, 2026-11-19): mean of the MLP + BLL
# support network mlp_bll.lf1.theta_absolute.lr3e-3.yaml on evt_2_train (rate_unlabeled) ->
# observed rate_1_train fraction (rate_train), log space; learned constant noise per level.
# Scored on all of rate_1_val (rate_validation, 1000 voxels). Needs the predict output of the run.
#   BLAS_THREADS=32 sbatch -q regular -t 02:00:00 scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/mfgp.mlp_bll_lf1.log.yaml mfgp
levels:
- source: model_mean
  partition: rate_unlabeled   # evt_2_train
  fidelity: lf
  inference: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/event_learning/mlp_bll_lf1_theta_absolute_lr3e-3/v1/seed0/inference/best/rate_unlabeled_lf.npz
- source: observed_fraction
  partition: rate_train       # rate_1_train, 5000 events per voxel (target)
  fidelity: hf
evaluation:
- {partition: rate_validation, fidelity: hf}
output_transform: log   # log of the rate; observed fractions smoothed to (m + 0.5)/(N + 1)
kernel: rbf
n_restarts: 5
seed: 0
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data/views/theta_absolute   # the view the run predicted on
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/regression/mfgp_mlp_bll_lf1_hf_log/v1/seed0
