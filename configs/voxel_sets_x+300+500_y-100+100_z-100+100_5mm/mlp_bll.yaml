# MLP + Bayesian last layer on voxel_sets_x+300+500_y-100+100_z-100+100_5mm; same settings as
# voxel_sets_x-800-600_y+50+250_z+400+600_5mm/mlp_bll.yaml: trains on LF2 + HF train (benchmark rule,
# docs/benchmark.md), checkpoints selected on LF validation (cnp_validation).
model:
  kind: mlp
  architecture:
    hidden_dims: [256, 256, 256]
    dropout: 0.0
  last_layer:
    prior_precision: evidence
    draws: 1000
    seed: 0
training:
  backend: neural
  loss: bernoulli
  n_passes: 10
  eval_every: 100
  learning_rate: 0.001
  batch_size: 16
  n_events: 750
  targets: disjoint
  context:
    size: random
    n_min: 16
    max_fraction: 0.5
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: natural
  weighting:
    strategy: none
selection: bernoulli_log_loss
lf_validation: true
hf_validation: false
test_fidelities: [] # Test (gp_test) stays blinded; benchmark and score stage unblind it at the end.
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
train_sets:
- {partition: gp_unlabeled, fidelity: lf}   # LF2_train
- {partition: gp_train, fidelity: hf}       # HF_train
partitions: {validation: cnp_validation, test: gp_test}  # rate model: its test set is the blinded GP test (core.surrogates score refuses it)
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/event_learning/mlp_bll/v1/seed0
selection_max_design_points: 500
evaluation_threads: 16
residual_test: {}  # residual learnability test at read-out (RESUM_FLEX docs/evaluation.md)
