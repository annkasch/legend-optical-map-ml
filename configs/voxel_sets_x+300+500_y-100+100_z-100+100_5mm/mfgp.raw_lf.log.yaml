# Two-level MFGP on voxel_sets_x+300+500_y-100+100_z-100+100_5mm without an event model: simulated LF hit
# fraction of evt_2_train (gp_unlabeled, also simulated with optical hits) -> observed reg_1_train
# fraction, log space; learned constant noise per level. Same training data as mlp_bll*.yaml
# (train_sets). As voxel_sets_x-800-600_y+50+250_z+400+600_5mm/mfgp.raw_lf.log.yaml (2026-11-17).
#   BLAS_THREADS=32 sbatch -q regular -t 02:00:00 scripts/slurm/train_surrogate.sbatch configs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/mfgp.raw_lf.log.yaml mfgp
levels:
- source: observed_fraction
  partition: gp_unlabeled   # evt_2_train, 1500 events per voxel
  fidelity: lf
- source: observed_fraction
  partition: gp_train       # reg_1_train, 5000 events per voxel (target)
  fidelity: hf
evaluation:
- {partition: gp_validation, fidelity: hf}
output_transform: log   # log of the rate; observed fractions smoothed to (m + 0.5)/(N + 1)
kernel: rbf
n_restarts: 5
seed: 0
data_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data
data_provider: legend_optical_map_ml.provider:OpticalDataset
data_config: data.yaml
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/regression/mfgp_raw_lf_hf_log/v1/seed0
