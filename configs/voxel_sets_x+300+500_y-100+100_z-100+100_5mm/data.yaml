# Own genesis-remage voxel campaign (same sampling as LBNL secondment, box x 300..500 mm,
# y -100..100, z -100..100, 5 mm voxels): LF 1500 / HF 5000 photons per voxel.
# Roles as in voxel_sets_x-800-600_y+50+250_z+400+600_5mm/data.yaml. Raw data on $PSCRATCH (purge policy).
# Manifests renamed 2026-11-18 (evt = event model, reg = regression; T/V = train/validation
# in the voxel_id prefixes evtT_n, evtV_n, regT_n, regV_n); evt_1_val grew from 500 to 1600 voxels.
source:
  manifests:
  - path: /pscratch/sd/a/aschuetz/genesis-remage/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/voxels_evt_1_train.csv
    role: evt_train
  - path: /pscratch/sd/a/aschuetz/genesis-remage/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/voxels_evt_1_val.csv
    role: evt_validation
  - path: /pscratch/sd/a/aschuetz/genesis-remage/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/voxels_evt_2_train.csv
    role: rate_unlabeled
  - path: /pscratch/sd/a/aschuetz/genesis-remage/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/voxels_reg_1_train.csv
    role: rate_train
  # reg_1_val: 1000 HF voxels since 2026-11-19 (500 taken over from reg_2_val), all of them
  # rate_validation; no rate_test (before: 500 voxels, 50/50 rate_validation / rate_test, so
  # older box scores on 250 voxels are not directly comparable). reg_2_val (44 540 unseen),
  # reg_3_val (12 480 at evt_*_train positions) and reg_4_val (1600 at evt_1_val positions)
  # are not used yet (docs/datasets.md).
  - path: /pscratch/sd/a/aschuetz/genesis-remage/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/voxels_reg_1_val.csv
    role: rate_validation
output_directory: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data
cache_directory: ../../outputs/event_cache  # shared by all datasets (docs/event-cache.md)
theta:
  coordinates: cartesian
  center_source: filename # CSV x_mm/y_mm/z_mm override the rounded filename center.
phi:
  vertex:
    representation: offset
    coordinates: cartesian
  momentum:
    representation: components
target:
  kind: any_channel
split:
  seed: 42
  manifest: ../../outputs/voxel_sets_x+300+500_y-100+100_z-100+100_5mm/data/splits/voxel_split.json
normalization:
  method: standard
  fit_on: training
# Further views of the same files and split (docs/data-config.md, Views); written to
# data/views/<name>/, picked by a run's data_directory.
views:
  # Input comparison for MLP + BLL (2026-11-14), as in voxel_sets_x-800-600_y+50+250_z+400+600_5mm:
  # (a) θ + offset + momentum is the top-level view, (b) θ + raw vertex + momentum is
  # theta_absolute, (c) raw vertex + momentum is emission.
  theta_absolute:   # (b); also the evaluation view of the stream fields
    # (configs/photon_x+300+500_y-100+100_z-100+100/field_f*.yaml, dim_theta: 3): their phi
    # columns equal the stream records x, y, z, px, py, pz.
    phi:
      vertex:
        representation: absolute
        coordinates: cartesian
      momentum:
        representation: components
  emission:   # (c) emission point (absolute vertex) + momentum only; voxel centre no network input;
    # also the evaluation view of the stream MLP + BLL (photon_x+300+500_y-100+100_z-100+100/mlp_bll.yaml)
    theta:
      model_input: false
      coordinates: cartesian
      center_source: filename
    phi:
      vertex:
        representation: absolute
        coordinates: cartesian
      momentum:
        representation: components
